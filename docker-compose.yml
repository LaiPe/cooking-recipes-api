services:
  mongodb:
    image: mongo:7.0
    container_name: recipes-mongodb
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cooking_recipes
    volumes:
      - mongodb_data:/data/db
      - ./mongo-init:/docker-entrypoint-initdb.d
    networks:
      - recipes-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: recipes-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - mongodb
    networks:
      - recipes-network

volumes:
  mongodb_data:

networks:
  recipes-network:
    driver: bridge